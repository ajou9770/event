<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>신협-금호리조트 제휴 이용 안내</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #f8f9fa;
      font-family: 'Noto Sans KR', sans-serif;
    }
    .main-title {
      font-size: 1.75rem;
      font-weight: 700;
      text-align: center;
      color: #2c3e50;
      margin-top: 2rem;
      margin-bottom: 1rem;
    }
    .resort-card {
      background-color: white;
      border-radius: 1rem;
      box-shadow: 0 0 15px rgba(0, 0, 0, 0.1);
      padding: 2rem;
      margin-top: 2rem;
    }
    .btn-link {
      margin: 0.5rem 0;
      width: 100%;
    }
    img.resort-image {
      width: 100%;
      max-height: 550px;
      object-fit: cover;
      border-radius: 1rem;
      box-shadow: 0 0 10px rgba(0,0,0,0.15);
    }
  </style>
</head>
<body>
  <div class="container">
    <h3 class="main-title">🏨 신협-금호 제휴 리조트 & 스파 이용 안내</h3>
    
    <div class="resort-card" style="text-align: center;">
      <img src="img/kumho_resort.jpg" alt="금호리조트" class="resort-image mb-4">

      <h4 class="mb-3">📌 통영/설악/화순/제주 아산 스파포레 예약 & 아산스파비스 입장권 구매</h4>

      <a class="btn btn-outline-primary" href="#" id="roomLink">
        📱 금호리조트 제휴 객실 예약하기
      </a>
      <br><br>
      <a class="btn btn-outline-success" href="#" id="ticketLink">
        📱 아산스파비스 할인(18,000원) 입장권 구매
      </a>
    </div>
  </div>

  <script>
    // 디바이스가 모바일인지 확인
    function isMobile() {
      return /Android|iPhone|iPad|iPod|webOS|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
    }

    // 객실 예약 링크
    document.getElementById("roomLink").addEventListener("click", function(e) {
      e.preventDefault();
      const url = isMobile()
        ? "https://m.kumhoresort.co.kr/groupcp/company/cu.asp"
        : "https://www.kumhoresort.co.kr/reservation/tcompany/company/cu.html";
      window.open(url, '_blank');
    });

    // 입장권 링크
    document.getElementById("ticketLink").addEventListener("click", function(e) {
      e.preventDefault();
      const url = isMobile()
        ? "http://m.spavis.co.kr/spacompany/cpindex.asp?cpCode=413180"
        : "https://www.spavis.co.kr/spacp/index.asp?cpCode=413180";
      window.open(url, '_blank');
    });
  </script>
</body>
</html>
