<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>⭐헌혈감사 쿠폰 신청하기</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-KK94CHFLLe+nY2dmCWGMq91rCGa5gtU4mk92HdvYe+M/SXH301p5ILy+dN9+nJOZ"
          crossorigin="anonymous">
    <script src="https://code.jquery.com/jquery-1.12.4.js"></script>
    <script src="https://code.jquery.com/ui/1.12.1/jquery-ui.js"></script>

    <style>
      body { margin: 10px; }
      #loading-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        background-color: rgba(0,0,0,0.5); display: none; justify-content: center; align-items: center; z-index: 9999; }
      #loading-message { font-size: 24px; color: white; }
      #loading-spinner { border: 16px solid #f3f3f3; border-top: 16px solid #3498db; border-radius: 50%;
        width: 50px; height: 50px; animation: spin 2s linear infinite; }
      @keyframes spin { 0%{transform:rotate(0)} 100%{transform:rotate(360deg)} }
      #confetti-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 9999; }
      .confetti { position: absolute; width: 10px; height: 10px; background: #ff0; opacity: 0; }
      .input-group + .input-group { margin-top: 10px; }
    </style>

    <script>
  // ✅ 숫자만 남기기
  function onlyDigits(s){ return String(s||'').replace(/[^0-9]/g,''); }

  // ✅ 전화번호 간단 정합성(10~11자리)
  function isValidPhone(num) {
    const d = onlyDigits(num);
    return d.length === 10 || d.length === 11;
  }

  // ✅ 알림톡 PHP 엔드포인트(서버에 업로드한 파일 경로)
  const ALIMTALK_ENDPOINT = 'https://ajoucu.mycafe24.com/relay_blood_cpn.php';

 async function submitForm(event) {
  event.preventDefault();

  const form = document.getElementById('signupForm');
  const submitBtn = document.getElementById('submitBtn'); // ✅ 버튼 핸들(HTML에 id="submitBtn" 추가)
  const formData = new FormData(form);

  const data = {
    name: String(formData.get('name')||'').trim(),
    idnum: onlyDigits(formData.get('idnum')),
    tel: onlyDigits(formData.get('tel')),
    etc: String(formData.get('etc')||'').trim()
  };

  // 프론트 검증
  if (!data.name) { alert('성명을 입력하세요.'); return; }
  if (!data.idnum) { alert('사번 또는 조합원번호를 입력하세요.'); return; }
  if (!isValidPhone(data.tel)) { alert('연락처는 10~11자리 숫자만 입력하세요.'); return; }

  const confirmationMessage =
`이름: ${data.name}
전화번호: ${data.tel}
사번/조합원번호: ${data.idnum}

이대로 제출하시겠습니까?`;

  if (!confirm(confirmationMessage)) {
    alert('⚠️ 제출이 취소되었습니다.');
    return;
  }

  // ✅ 버튼 상태 변경 (제출 중 표시 + 비활성화)
  if (submitBtn) {
    submitBtn.disabled = true;
    submitBtn.textContent = '📤제출중...';
  }

  setLoading(true);

  try {
    // 1) GAS 저장 (반드시 먼저)
    const gasResp = await fetch(
      'https://script.google.com/macros/s/AKfycbyve-xNtkR8QdMpd7PpIjd98-hSw3RIxcvpWpIcpqTFjewGiCqtGaMABlxgv1SXZ1oj/exec',
      {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: new URLSearchParams(data)
      }
    );

    const gasJson = await gasResp.json().catch(()=>({status:'error'}));
    if (gasJson.status !== 'success') {
      throw new Error('GAS 저장 실패');
    }

    // 2) 저장 성공 → 알림톡 발송 (성공/실패를 "별도"로 안내)
    let altOk = false;
    try {
      // PHP로 알림톡 발송 요청 (changeWord 제거)
      const altResp = await fetch(ALIMTALK_ENDPOINT, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json; charset=utf-8' },
        body: JSON.stringify({
          name: data.name,
          to: data.tel
        })
      });

      const altJson = await altResp.json().catch(()=>({result:'error'}));
      altOk = altResp.ok && String(altJson.result||'').toLowerCase() !== 'error';
    } catch (e) {
      altOk = false;
      console.error('알림톡 예외:', e);
    }

    // 최종 사용자 안내
    if (altOk) {
      throwConfetti();
      setTimeout(()=>form.reset(), 800);
      alert('👌 접수가 완료되었습니다.\n\n☕ 모바일 커피 🎫 쿠폰은 신청일로부터 1~2일 내 카톡 알림톡으로 보내 드립니다.');
    } else {
      alert('👌 접수는 완료되었습니다.\n⚠️ 다만 알림톡 발송에 실패했습니다. 관리자에게 문의해 주세요.');
    }

  } catch (err) {
    console.error(err);
    alert('⚠️ 제출 중 오류가 발생했습니다. 다시 시도해 주세요.');
  } finally {
    // ✅ 버튼 상태 원복
    if (submitBtn) {
      submitBtn.disabled = false;
      submitBtn.textContent = '✔제출하기';
    }
    setLoading(false);
  }
}

  function setLoading(flag){
    const overlay = document.getElementById('loading-overlay');
    overlay.style.display = flag ? 'flex' : 'none';
  }

  function throwConfetti() {
    const container = document.getElementById('confetti-container');
    for (let i = 0; i < 100; i++) {
      const confetti = document.createElement('div');
      confetti.className = 'confetti';
      confetti.style.left = Math.random() * 100 + 'vw';
      confetti.style.top = Math.random() * 100 + 'vh';
      confetti.style.backgroundColor = '#' + Math.floor(Math.random() * 16777215).toString(16);
      container.appendChild(confetti);
    }
    const confettis = document.getElementsByClassName('confetti');
    setTimeout(() => {
      for (let i=0;i<confettis.length;i++){
        confettis[i].style.opacity = 1;
        confettis[i].style.transform = 'translateY(100vh)';
        confettis[i].style.transition = 'all 3s ease-in-out';
      }
    }, 0);
    setTimeout(()=>{ container.innerHTML=''; }, 3000);
  }

  window.addEventListener('load', () => setLoading(false));
</script>

  </head>

  <body>
    <h4>| 헌혈감사 모바일 커피 쿠폰 신청 |</h4>
    <br>

    <form id="signupForm" onsubmit="submitForm(event)">
      <div class="input-group">
        <span class="input-group-text">✨조합원성명</span>
        <input type="text" id="name" name="name" class="form-control" required />
      </div>

      <!-- 입력부 예시 -->
<div class="input-group">
  <span class="input-group-text">🔢사번or조합원번호</span>
  <input type="tel" id="idnum" name="idnum" class="form-control" inputmode="numeric" pattern="[0-9]*" placeholder="숫자만" required>
</div>

<div class="input-group">
  <span class="input-group-text">📱연락처</span>
  <input type="tel" id="tel" name="tel" class="form-control" inputmode="numeric" pattern="[0-9]*" placeholder="숫자만 입력하세요" required>
</div>


      <div class="mt-3">
        <label for="etc" class="form-label">💬기타 남기실 말씀?(선택)</label>
        <input class="form-control" type="text" id="etc" name="etc">
      </div>

      <button id="submitBtn" class="btn btn-primary w-100 mt-3" type="submit">✔제출하기</button>
    </form>

    <div id="loading-overlay">
      <div id="loading-spinner"></div>
      <div id="loading-message">
        <span style="padding-left: 15px;">📤제출중입니다...잠시만 기다려주세요</span><br>
        <small>✨평생어부바 신협</small>
      </div>
    </div>

    <div id="confetti-container"></div>
  </body>
</html>
