<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>⭐헌혈감사 쿠폰 신청하기</title>
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-KK94CHFLLe+nY2dmCWGMq91rCGa5gtU4mk92HdvYe+M/SXH301p5ILy+dN9+nJOZ"
            crossorigin="anonymous">
        <script src="https://code.jquery.com/jquery-1.12.4.js"></script>
        <script src="https://code.jquery.com/ui/1.12.1/jquery-ui.js"></script>
        <style>
            body {
                margin: 10px;
            }
            #loading-overlay {
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background-color: rgba(0, 0, 0, 0.5);
                display: flex;
                justify-content: center;
                align-items: center;
                z-index: 9999;
            }
            #loading-message {
                font-size: 24px;
                color: white;
            }
            #loading-spinner {
                border: 16px solid #f3f3f3;
                border-top: 16px solid #3498db;
                border-radius: 50%;
                width: 50px;
                height: 50px;
                animation: spin 2s linear infinite;
            }
            @keyframes spin {
                0% {
                    transform: rotate(0deg);
                }
                100% {
                    transform: rotate(360deg);
                }
            }
            #confetti-container {
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                pointer-events: none;
                z-index: 9999;
            }
            .confetti {
                position: absolute;
                width: 10px;
                height: 10px;
                background: #ff0;
                opacity: 0;
            }
        </style>
        <script>
            async function submitForm(event) {
                event.preventDefault();
                const form = document.getElementById('signupForm');
                const formData = new FormData(form);

                const data = {
                    name: formData.get('name'),
                    idnum: formData.get('idnum'),
                    tel: formData.get('tel'),
                    etc: formData.get('etc')
                };

                const confirmationMessage = `
                이름: ${data.name}
                전화번호: ${data.tel}
                사번또는조합원번호: ${data.idnum}

                이대로 제출하시겠습니까?`;

                if (confirm(confirmationMessage)) {
                    try {
                        const response = await fetch(
                            'https://script.google.com/macros/s/AKfycbyve-xNtkR8QdMpd7PpIjd98-hSw3RIxcvpWpI' +
                                    'cpqTFjewGiCqtGaMABlxgv1SXZ1oj/exec',
                            {
                                method: 'POST',
                                headers: {
                                    'Content-Type': 'application/x-www-form-urlencoded'
                                },
                                body: new URLSearchParams(data)
                            }
                        );

                        const result = await response.json();

                        if (result.status === 'success') {
                            throwConfetti();
                            setTimeout(() => form.reset(), 2000);
                            alert(
                                '👌 헌혈 감사 쿠폰이 신청 되었습니다. \n ☕ 모바일 커피 🎫 쿠폰은 신청일로부터 1~2일내 카톡 알림톡으로 보내 드립니다'
                            );
                        } else {
                            alert('⚠️ 제출 중 오류가 발생했습니다.');
                        }
                    } catch (error) {
                        console.error('Error:', error);
                        alert('⚠️ 제출 중 오류가 발생했습니다.');
                    }
                } else {
                    alert('⚠️ 제출이 취소되었습니다.');
                }
            }

            function throwConfetti() {
                var container = document.getElementById('confetti-container');
                for (var i = 0; i < 100; i++) {
                    var confetti = document.createElement('div');
                    confetti.className = 'confetti';
                    confetti.style.left = Math.random() * 100 + 'vw';
                    confetti.style.top = Math.random() * 100 + 'vh';
                    confetti.style.backgroundColor = '#' + Math
                        .floor(Math.random() * 16777215)
                        .toString(16);
                    container.appendChild(confetti);
                }

                var confettis = document.getElementsByClassName('confetti');
                setTimeout(function () {
                    for (var i = 0; i < confettis.length; i++) {
                        confettis[i].style.opacity = 1;
                        confettis[i].style.transform = 'translateY(100vh)';
                        confettis[i].style.transition = 'all 3s ease-in-out';
                    }
                }, 0);

                setTimeout(function () {
                    container.innerHTML = '';
                }, 3000);
            }
            window.addEventListener('load', function () {
                var spinner = document.getElementById('loading-spinner');
                var loadingOverlay = document.getElementById('loading-overlay');
                spinner.style.display = 'none';
                loadingOverlay.style.display = 'none';
            });
        </script>
    </head>
    <body>
        <h4>| 헌혈감사 모바일 커피 쿠폰 신청 |</h4>
        <br>
        <form id="signupForm" onsubmit="submitForm(event)">
            <div class="input-group">
                <div class="input-group-prepend">
                    <span class="input-group-text" id="basic-addon1">✨조합원성명</span>
                </div>
                <input
                    type="text"
                    id="name"
                    name="name"
                    class="form-control"
                    required="required">
            </div>
            <div class="input-group">
                <div class="input-group-prepend">
                    <small class="input-group-text" for="employeeID">🔢사번or조합원번호</small>
                </div>
                <input
                    type="number"
                    id="idnum"
                    name="idnum"
                    class="form-control"
                    placeholder="숫자만"
                    required="required">
            </div>
            <div class="input-group">
                <div class="input-group-prepend">
                    <span class="input-group-text" for="mobile">📱연락처</span>
                </div>
                <input
                    type="number"
                    id="tel"
                    name="tel"
                    placeholder="숫자만 입력하세요"
                    class="form-control"
                    required="required">
            </div>
            <br><br>
            <label for="etc">💬기타 남기실 말씀?(선택)</label>
            <input class="form-control" type="text" id="etc" name="etc"><br>
            <button class="btn btn-primary w-100" type="submit">✔제출하기</button>
        </form>
        <div id="loading-overlay">
            <div id="loading-spinner"></div>
            <div id="loading-message">
                <span style="padding-left: 15px;">로딩중입니다...</span>
                <br>
                <small>✨평생어부바 신협</small>
            </div>
        </div>
        <div id="confetti-container"></div>
    </body>
</html>
