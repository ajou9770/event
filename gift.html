
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- jQuery (Bootstrap의 JavaScript 플러그인에 필요) -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <title>⭐수신거래 우수조합원 명절 선물신청하기</title>
    <script>
  location.replace("https://ajou9770.github.io/shop/vip_order.html");
</script>

    <style>
    :root{
      --bg:#0b1220;
      --card: rgba(255,255,255,.08);
      --card2: rgba(255,255,255,.06);
      --text:#eaf0ff;
      --muted: rgba(234,240,255,.72);
      --line: rgba(255,255,255,.10);
      --accent:#4c8dff;
    }
    body{
      margin:0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, "Noto Sans KR", "Apple SD Gothic Neo", sans-serif;
      background:
        radial-gradient(900px 500px at 20% 0%, rgba(76,141,255,.35), transparent 60%),
        radial-gradient(900px 500px at 85% 10%, rgba(168,85,247,.30), transparent 55%),
        var(--bg);
      color: var(--text);
      min-height: 100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding: 20px;
    }
    .wrap{
      width:min(560px, 100%);
    }
    .card{
      background: linear-gradient(180deg, var(--card), var(--card2));
      border: 1px solid var(--line);
      border-radius: 18px;
      box-shadow: 0 18px 50px rgba(0,0,0,.35);
      padding: 22px 20px;
      backdrop-filter: blur(10px);
    }
    .title{
      display:flex;
      align-items:center;
      gap:10px;
      margin:0 0 10px;
      font-size: 20px;
      font-weight: 800;
    }
    .badge{
      font-size: 12px;
      padding: 4px 10px;
      border-radius: 999px;
      background: rgba(76,141,255,.18);
      border: 1px solid rgba(76,141,255,.35);
      color: #cfe0ff;
      font-weight: 700;
    }
    .desc{
      margin: 0 0 14px;
      color: var(--muted);
      line-height: 1.55;
      font-size: 14px;
    }
    .box{
      background: rgba(255,255,255,.06);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 14px;
      margin: 12px 0 16px;
      line-height: 1.55;
      font-size: 14px;
    }
    .url{
      word-break: break-all;
      color: #dbe7ff;
      font-weight: 700;
    }
    .progress{
      height: 10px;
      border-radius: 999px;
      overflow: hidden;
      background: rgba(255,255,255,.08);
      border: 1px solid var(--line);
      margin: 12px 0 6px;
    }
    .bar{
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, rgba(76,141,255,.95), rgba(168,85,247,.85));
      transition: width .25s linear;
    }
    .row{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap: 10px;
      margin-top: 12px;
      flex-wrap: wrap;
    }
    .btn{
      appearance:none;
      border: 1px solid rgba(76,141,255,.35);
      background: rgba(76,141,255,.18);
      color: #eaf0ff;
      padding: 10px 14px;
      border-radius: 12px;
      font-weight: 800;
      cursor:pointer;
      text-decoration:none;
      display:inline-flex;
      align-items:center;
      gap:8px;
    }
    .btn:hover{ filter: brightness(1.05); }
    .btn.outline{
      background: transparent;
      border-color: rgba(255,255,255,.18);
      color: rgba(234,240,255,.9);
    }
    .small{
      color: rgba(234,240,255,.65);
      font-size: 12px;
      margin-top: 10px;
    }
    .count{
      font-weight: 800;
      color: #cfe0ff;
    }
</style>

<!-- AjouCU shared event mobile UI -->
<link rel="stylesheet" href="event-ui.css?v=20260814">
<script src="event-ui.js?v=20260814" defer></script>
</head>
<!-- onload="alert('🤷‍♂️2023동계 성수기 예약신청이 마감되었습니다.')" -->
<body>
  <div class="wrap">
    <div class="card">
      <div class="title">
        📣 페이지 이동 안내
        <span class="badge">자동 이동</span>
      </div>

      <p class="desc">
        새로운 신청 페이지로 안전하게 이동 중이에요.<br>
        잠시만 기다려 주세요.
      </p>

      <div class="box">
        📍 쿠폰선택시 알림톡에 배송지에 쿠폰번호가 즉시 발송됩니다.<br>
        특판몰에 쿠폰등록 후 사용해 주세요.
        <div style="margin-top:10px;">
          이동 주소: <span class="url">https://ajou9770.github.io/shop/vip_order.html</span>
        </div>
      </div>

      <div class="progress" aria-hidden="true">
        <div class="bar" id="bar"></div>
      </div>
      <div class="desc" style="margin:0;">
        <span class="count" id="sec">2</span>초 후 자동으로 이동합니다.
      </div>

      <div class="row">
        <a class="btn" href="https://ajou9770.github.io/shop/vip_order.html">🚀 지금 바로 이동</a>
        <button class="btn outline" type="button" onclick="copyUrl()">📋 주소 복사</button>
      </div>

      <div class="small">
        자동 이동이 되지 않으면 “지금 바로 이동” 버튼을 눌러주세요.
      </div>
    </div>
  </div>

  <script>
    const TARGET = "https://ajou9770.github.io/shop/vip_order.html";

    // ✅ 2초 카운트다운 후 이동 (원하면 seconds=0으로 바꾸면 즉시 이동)
    let seconds = 0;
    const secEl = document.getElementById("sec");
    const bar = document.getElementById("bar");

    function tick(){
      secEl.textContent = seconds;
      const pct = ((2 - seconds) / 2) * 100;
      bar.style.width = Math.max(0, Math.min(100, pct)) + "%";

      if (seconds <= 0) {
        // replace()는 뒤로가기 시 원페이지로 덜 돌아가서 리다이렉트에 적합
        location.replace(TARGET);
        return;
      }
      seconds -= 1;
      setTimeout(tick, 1000);
    }
    tick();

    function copyUrl(){
      navigator.clipboard?.writeText(TARGET)
        .then(() => alert("주소가 복사되었습니다."))
        .catch(() => {
          // clipboard 미지원 fallback
          prompt("아래 주소를 복사하세요:", TARGET);
        });
    }
  </script>
</body>
</html>
