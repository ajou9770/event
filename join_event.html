<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>⭐온라인가입 이벤트 신청</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    .form-inline .form-label {
      min-width: 120px;
      margin-right: 10px;
    }
    .form-inline .form-control {
      flex: 1;
    }
    .form-inline {
      display: flex;
      align-items: center;
      margin-bottom: 10px;
    }
  </style>
</head>
<body class="container py-5">

  <h3 class="mb-4">🎯 이벤트 참가 신청하기</h3>

  <form id="eventForm">
    <div class="form-inline">
      <label class="form-label">💡이름*</label>
      <input type="text" class="form-control" id="name" required>
    </div>
    <div class="form-inline">
      <label class="form-label">🚩사번*</label>
      <input type="text" class="form-control" id="employeeId" required>
    </div>
    <div class="form-inline">
      <label class="form-label">📞연락처*</label>
      <input type="text" class="form-control" id="contact" pattern="\d+" required placeholder="숫자만 입력">
    </div>
    <div class="form-inline">
      <label class="form-label">📌미션 완료(예정)일*</label>
      <input type="date" class="form-control" id="missionDate" required>
    </div>
    <div class="form-inline">
      <label class="form-label">🗨️기타 남기실 말씀</label>
      <input type="text" class="form-control" id="comment">
    </div>
    <div class="accordion mb-3" id="consentAccordion">
      <div class="accordion-item">
        <h2 class="accordion-header" id="consentHeading">
          <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#consentCollapse" aria-expanded="false" aria-controls="consentCollapse">
            📄 이벤트참가내용, 개인정보 수집 및 활용 동의 내용 보기/닫기
          </button>
        </h2>
        <div id="consentCollapse" class="accordion-collapse collapse" aria-labelledby="consentHeading" data-bs-parent="#consentAccordion">
          <div class="accordion-body">
            <p>
             1. 이벤트 내용(수행해야하는 미션)<br><br>
                - 아주대학교의료원신협 조합원 가입(창구 또는 온라인가입)<br>
                - 체크카드 발급 (온라온 또는 창구발급모두 가능)<br><br>
             2. 개인정보 수집 및 활용 내용 <br>
            </p>
            <ul>
              <li><strong>수집 항목:</strong> 성명 및 연락처</li>
              <li><strong>이용 목적:</strong> 이벤트 참가</li>
              <li><strong>보유 기간:</strong> 행사 종료 후 1개월 이내 파기</li>
            </ul>
            <p>
              선생님은 개인정보 수집 및 활용에 동의하지 않을 권리가 있으며, 동의하지 않을 경우 이벤트 신청이 제한될 수 있습니다.
            </p>
          </div>
        </div>
      </div>
    </div>
    
    <div class="form-check mb-3">
      <input class="form-check-input" type="checkbox" id="consent" required>
      <label class="form-check-label" for="consent">
        📄 상기 이벤트 내용을 확인 하였으며, 개인정보 수집 및 활용에 동의합니다.
      </label>
    </div>
    <div class="mt-4">
      <button type="submit" id="submitBtn" class="btn btn-primary w-100">📤 신청하기</button>
      <div id="loading" class="text-center mt-2 text-secondary" style="display: none;">⏳ 제출 중입니다...</div>
    </div>


    <div class="mt-3 text-center">
      <a href="https://ajou9770.github.io/usertip/join01.html" class="btn btn-outline-success btn-" target="_blank">🌐 온라인 가입하기</a>
    </div>
  </form>
  <hr>
  <h4 class="mb-3">📇 체크카드 선택</h4>

  <select class="form-control" onchange="handleSelectChange(this)">
    <option value="">✔체크카드 선택</option>
    <option value="https://m.cu.co.kr/otu/Zm4ubD0C">CU big Simple하이브리드(교통)카드</option>
    <option value="https://m.cu.co.kr/otu/zl4ubD0C">CU Big Simple 체크카드</option>
    <option value="https://m.cu.co.kr/otu/gm4ubD0C">CU Big 청춘 체크카드(어부바ver)</option>
    <option value="https://m.cu.co.kr/otu/UjN1bD0C">CU pay 체크카드(기본형)</option>
    <option value="https://m.cu.co.kr/otu/qlN1bD0C">CU big 클래식 체크카드</option>
    <option value="https://m.cu.co.kr/otu/nnN1bD0C">CU 장보고 체크카드</option>
    <option value="https://m.cu.co.kr/otu/00N1bD0C">신협 에어머니 체크카드</option>
  </select>
  <!-- Bootstrap JS Bundle (body 맨 아래에 삽입) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <script>
   const form = document.getElementById("eventForm");
const submitBtn = document.getElementById("submitBtn");
const loading = document.getElementById("loading");
const consentCheckbox = document.getElementById("consent");  // 동의 체크박스

form.addEventListener("submit", async function (e) {
  e.preventDefault();

  const name = document.getElementById("name").value.trim();
  const employeeId = document.getElementById("employeeId").value.trim();
  const contact = document.getElementById("contact").value.trim();
  const missionDate = document.getElementById("missionDate").value;
  const comment = document.getElementById("comment").value.trim();

  if (!name || !employeeId || !contact || !missionDate) {
    alert("⚠ 필수항목을 모두 입력해 주세요.");
    return;
  }

  if (!consentCheckbox.checked) {
    alert("⚠ 개인정보 수집 및 활용에 동의해 주세요.");
    return;
  }

  // ✅ 입력내용 확인창 띄우기
  const confirmMessage = `
입력하신 내용을 확인해 주세요:

- 이름: ${name}
- 사번: ${employeeId}
- 연락처: ${contact}
- 미션 완료일: ${missionDate}
- 기타 말씀: ${comment ? comment : '없음'}

제출하시겠습니까?
  `;
  if (!confirm(confirmMessage)) {
    // 사용자가 "취소"를 누르면 여기서 멈춤
    return;
  }

  submitBtn.disabled = true;
  loading.style.display = "block";

  try {
    await fetch("https://script.google.com/macros/s/AKfycbxGGZp1MincKrOnvvkHO7DqT2QJHREFOGTt1bs5UDvhm7ewXc0yxe7fuWQaJ9upWmsE5Q/exec", {
      method: "POST",
      mode: "no-cors",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ name, employeeId, contact, missionDate, comment })
    });

    alert("✅ 신청이 완료되었습니다!");
    form.reset();
    consentCheckbox.checked = false; // 폼 리셋시 체크박스도 초기화
  } catch (err) {
    alert("❌ 제출 중 오류가 발생했습니다. 다시 시도해 주세요.");
  } finally {
    submitBtn.disabled = false;
    loading.style.display = "none";
  }
});
  </script>
   <script>
    function handleSelectChange(selectElement) {
      alert("🤷‍♂️조합(신협)은 '아주대'로 검색하세요 \n체크카드는 연간사용액의 약 0.8%가 이용고 배당으로 지급됩니다.");
      const selectedValue = selectElement.value;
      if (selectedValue) {
        window.open(selectedValue, '_blank');
      }
    }
 </script>
</body>
</html>
