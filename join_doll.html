    <script>
        function confirmLink(event, link) {
            event.preventDefault();
            if (confirm("🤷🏽‍♀️링크를 열어 자세히 볼까요?")) {
                window.open(link, "_blank");
            }
        }

        function handleScroll() {
            const scrollToTopBtn = document.querySelector(".scrollToTopBtn");
            if (window.scrollY > 200) {
                scrollToTopBtn.classList.add("show");
            } else {
                scrollToTopBtn.classList.remove("show");
            }
        }

        function scrollToTop() {
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function callon() {
            if (confirm("☏ 상담가능시간: 평일 8:30~17:00 📞전화앱으로 연결할까요?")) {
                window.location.href = "tel:031-219-6052";
            } else {
                alert("취소 되었습니다!!");
            }
        }

        function showSlides() {
            let slides = document.getElementsByClassName("slide");
            let slideIndex = 0;
            function displayNextSlide() {
                for (let i = 0; i < slides.length; i++) {
                    slides[i].classList.remove("active");
                }
                slideIndex++;
                if (slideIndex > slides.length) {
                    slideIndex = 1;
                }
                slides[slideIndex - 1].classList.add("active");
                setTimeout(displayNextSlide, 3000); // Change image every 3 seconds
            }
            displayNextSlide();
        }

        document.addEventListener("DOMContentLoaded", function() {
            showSlides();
            window.addEventListener("scroll", handleScroll);
            const scrollToTopBtn = document.querySelector(".scrollToTopBtn");
            scrollToTopBtn.addEventListener("click", scrollToTop);
        });

        window.addEventListener('load', function() {
            var loadingOverlay = document.getElementById('loading-overlay');
            loadingOverlay.style.display = 'none';
        });
    </script>
