<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>🎁 생일쿠폰 신청</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    .card-option { cursor: pointer; transition: transform 0.3s; }
    .card-option:hover { transform: scale(1.05); border: 2px solid #0d6efd; }
    .selected { border: 3px solid #0d6efd !important; }
  </style>
</head>
<body>
  <div class="container py-5">
    <h3 class="text-center mb-4">🎉 생일쿠폰 신청</h3>
    <form id="couponForm" class="p-4 bg-white rounded shadow">
      <div class="mb-3">
        <label class="form-label">💡성명</label>
        <input type="text" class="form-control" id="name" required>
      </div>
      <div class="mb-3">
        <label class="form-label">📞연락처</label>
        <input type="text" class="form-control" id="contact" placeholder="숫자만 입력" required>
      </div>
      <div class="mb-3">
        <label class="form-label">⭐쿠폰 선택</label>
        <div class="row">
          <div class="col-6">
            <div class="card card-option p-3" data-value="세븐일레븐쿠폰(2만원원)">
               <img src="https://cdn.011st.com/11dims/resize/600x600/quality/75/11src/product/1540391819/B.jpg?979000000" style="max-width:100%; height:180px;">

              <h3 class="text-center">10,000원권 * 2매</h3> 
            </div>
          </div>
          <div class="col-6">
            <div class="card card-option p-3" data-value="네이버 페이(1만5천원원)">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQMe6jelIGKUqp-zJPV5CfQ_yA6jnUTXrAOaw&s" style="max-width:100%; height:180px;">
              <h2 class="text-center">네이버페이 15,000원</h2> 
            </div>
          </div>
        </div>
        <input type="hidden" id="coupon" required>
      </div>
      <div class="mb-3">
        <label class="form-label">🗨️기타 코멘트</label>
        <textarea class="form-control" id="comment" rows="2"></textarea>
      </div>
      <button type="submit" id="submitBtn" class="btn btn-primary w-100">✅신청하기</button>
      <div id="loading" class="text-center mt-3" style="display:none;">⏳ 제출 중입니다...</div>
      <div id="result" class="text-center mt-3 fw-bold"></div>
    </form>
  </div>

  <script>
  const form = document.getElementById("couponForm");
  const submitBtn = document.getElementById("submitBtn");
  const loading = document.getElementById("loading");
  const result = document.getElementById("result");
  const couponField = document.getElementById("coupon");

  document.querySelectorAll('.card-option').forEach(card => {
    card.addEventListener('click', () => {
      document.querySelectorAll('.card-option').forEach(c => c.classList.remove('selected'));
      card.classList.add('selected');
      couponField.value = card.getAttribute('data-value');
    });
  });

  form.addEventListener('submit', async (e) => {
    e.preventDefault();

    const name = document.getElementById("name").value.trim();
    const contact = document.getElementById("contact").value.trim();
    const coupon = couponField.value;
    const comment = document.getElementById("comment").value.trim();

    if (!coupon) {
      alert("쿠폰을 선택해주세요.");
      return;
    }

    const confirmMsg = `
🧾 아래와 같이 생일 쿠폰을 신청 하시겠습니까?

👤 성명: ${name}
📱 연락처: ${contact}
🎁 선택한 쿠폰: ${coupon}
    `.trim();

    if (!confirm(confirmMsg)) return;

    // 🔄 버튼 상태 변경
    submitBtn.disabled = true;
    submitBtn.textContent = "🔂 신청중...";
    loading.style.display = 'block';
    result.textContent = '';

    const payload = { name, contact, coupon, comment };

    try {
      await fetch("https://script.google.com/macros/s/AKfycbxK65TCYR3z5ALxGUhXGOs3Y6jh11UPgKmh0m7WLPZQLqr1jvo841Q5Ocg4BKUffusY/exec", {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });

      result.textContent = "✅ 신청이 완료되었습니다!";
      form.reset();
      document.querySelectorAll('.card-option').forEach(c => c.classList.remove('selected'));
    } catch (error) {
      result.textContent = "❌ 신청 중 오류가 발생했습니다.";
    } finally {
      // 🔁 버튼 복원
      loading.style.display = 'none';
      submitBtn.disabled = false;
      submitBtn.textContent = "✅신청하기";
    }
  });
</script>
</body>
</html>
