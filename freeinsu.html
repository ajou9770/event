<!-- HTML (index.html) -->
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/signature_pad@4.0.0/dist/signature_pad.umd.min.js"></script>
    <title>🎉신협 무료 여행자보험 가입 신청서</title>
    <style>
        input[type="radio"], input[type="checkbox"] {
            transform: scale(1.5);
            margin-right: 10px;
            background-color:beige;
        }
        label {
            font-weight: bold;
        }
        .input-group-text {
            width: 150px;
        }
    </style>
</head>
<body>
<div class="container mt-5">
    <h4 class="mb-4">📝 신협 무료여행자 보험 가입 서비스 신청서</h4>
    <form id="insuranceForm">
        <div class="input-group mb-3">
            <span class="input-group-text">📌 조합원 번호</span>
            <input type="number" class="form-control" id="memberNumber" required>
        </div>
        <div class="input-group mb-3">
            <span class="input-group-text">👤 성명</span>
            <input type="text" class="form-control" id="fullName" required>
        </div>
        <div class="input-group mb-3">
            <span class="input-group-text">🎉 참조합원?</span>
            <select class="form-select" id="referenceMember" required>
                <option value="">✔️선택 하세요</option>
                <option value="으뜸이">으뜸이</option>
                <option value="믿음이">믿음이</option>
                <option value="도움이">도움이</option>
            </select>
        </div>
        <div>
            <small><b>⚠️무료 여행자보험서비스는 참조합원에게 제공되는 혜택입니다.</b> </small>
            </div><br>
        <div class="input-group mb-3">
            <span class="input-group-text">☎️ 연락처</span>
            <input type="tel" class="form-control" placeholder="숫자만 입력하세요" id="contactNumber" required>
        </div>
        <div class="input-group mb-3">
            <span class="input-group-text">📨 이메일(옵션)</span>
            <input type="email" class="form-control" placeholder="이메일로 신청 내역이 전송됩니다." id="email">
        </div>
        <div class="input-group mb-3">
            <span class="input-group-text">✈️방문국가/지역</span>
            <input type="text" class="form-control" id="destinationCountry" name="destinationCountry" required>
        </div>
        <div class="input-group mb-3">
            <span class="input-group-text">🛫출국 일자</span>
            <input type="date" class="form-control" id="travelPeriodStart" name="travelPeriodStart" required>
        </div>
        <div class="input-group mb-3">
            <span class="input-group-text">🛬입국 일자</span>
            <input type="date" class="form-control" id="travelPeriodEnd" name="travelPeriodEnd" required>
        </div>
        <div class="form-check mb-3">
            <p>
                📌 무료 여행자 보험 가입을 위한 성명, 주민등록번호, 연락처, 이메일 등의 개인정보의 수집, 활용 및 제3자(신협중앙회 공제사업부) 제공에 동의하십니까?
            </p>
        
            <div>
                <input type="radio" class="form-check-input" name="privacyConsent" id="consentYes" value="yes" required>
                <label class="form-check-label" for="consentYes">동의합니다(✔️필수)</label>
            </div>
        </div>
        
        <div class="mb-3">
            <label for="signature" class="form-label">📝 서명</label>
            <div class="position-relative">
                <canvas id="signatureCanvas" width="400" height="150" class="border"></canvas>
            </div>
            <button type="button" id="clearSignature" class="btn btn-secondary mt-2">🔂 서명 지우기</button>
        </div>       
        <div class="input-group mb-3">
            <span class="input-group-text">💬 남기실 말씀</span>
            <textarea class="form-control" id="comments" rows="1"></textarea>
        </div>
        <button type="submit" class="btn btn-primary w-100">✔️ 제출 하기</button>
    </form>
</div>
<script>
    const canvas = document.getElementById("signatureCanvas");
    const signaturePad = new SignaturePad(canvas);

    document.getElementById("insuranceForm").addEventListener("submit", async (e) => {
        e.preventDefault();

        const submitButton = e.target.querySelector("button[type='submit']");
        submitButton.innerHTML = "⏳ 제출중...";
        submitButton.disabled = true;

        const memberNumber = document.getElementById("memberNumber").value;
        const fullName = document.getElementById("fullName").value;
        const referenceMember = document.getElementById("referenceMember").value;
        const contactNumber = document.getElementById("contactNumber").value;
        const email = document.getElementById("email").value;
        const privacyConsent = document.querySelector("input[name='privacyConsent']:checked").value === 'yes';
        const comments = document.getElementById("comments").value;
        const destinationCountry = document.getElementById("destinationCountry").value;
        const travelPeriodStart = document.getElementById("travelPeriodStart").value;
        const travelPeriodEnd = document.getElementById("travelPeriodEnd").value;
        const signature = signaturePad.isEmpty() ? "" : signaturePad.toDataURL();

        const confirmMessage = `입력하신 정보를 확인해주세요:

` +
            `조합원 번호: ${memberNumber}
` +
            `성명: ${fullName}
` +
            `참조 조합원: ${referenceMember}
` +
            `연락처: ${contactNumber}
` +
            `이메일: ${email}
` +
            `개인정보 수집 동의: ${privacyConsent ? '동의함' : '동의하지 않음'}
` +
            `방문 국가: ${destinationCountry}
` +
            `여행 기간: ${travelPeriodStart} ~ ${travelPeriodEnd}
` +
            `코멘트: ${comments}

이대로 제출하시겠습니까?`;

        if (!confirm(confirmMessage)) {
            submitButton.innerHTML = "✔️ 제출 하기";
            submitButton.disabled = false;
            return;
        }

        const formData = {
            memberNumber,
            fullName,
            referenceMember,
            contactNumber,
            email,
            privacyConsent,
            comments,
            destinationCountry,
            travelPeriodStart,
            travelPeriodEnd,
            signature
        };
        alert("✈️제출중입니다. 잠시만 기다려 주세요. \n 제출결과는 📨이메일로 안내 드립니다.");
        try {
            const response = await fetch("https://script.google.com/macros/s/AKfycbwiSD2TOWtZVriAnVDP6uoi-IorbBPXF5Ka2Rh8sdCCD5Wbx-jdKLvtt7RSryggnqcwqw/exec", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                },
                mode: 'no-cors',
                body: JSON.stringify(formData),
            });

            alert("신청서가 성공적으로 제출되었습니다!");
            setTimeout(() => {
                document.getElementById("insuranceForm").reset();
                signaturePad.clear();
            }, 2000);
        } catch (error) {
            console.error("오류:", error);
            alert("신청서 제출 중 오류가 발생했습니다.");
        } finally {
            submitButton.innerHTML = "✔️ 제출 하기";
            submitButton.disabled = false;
        }
    });

    document.getElementById("clearSignature").addEventListener("click", () => {
        signaturePad.clear();
    });
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
