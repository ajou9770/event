<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>온라인 비대면 대출 신청</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
    background:
        radial-gradient(circle at top left,#dbeafe 0%,transparent 35%),
        radial-gradient(circle at bottom right,#fde68a 0%,transparent 30%),
        linear-gradient(135deg,#eff6ff,#ffffff);
    font-family:
        "Pretendard",
        "Noto Sans KR",
        sans-serif;
}

.main-card{
    width:100%;
    max-width:540px;
    background:rgba(255,255,255,.72);
    backdrop-filter:blur(18px);
    border:1px solid rgba(255,255,255,.6);
    border-radius:32px;
    box-shadow:0 20px 60px rgba(15,23,42,.12);
    padding:36px 24px;
    animation:fadeUp .7s ease;
}

.logo-badge{
    display:inline-block;
    background:#eef4ff;
    color:#2563eb;
    padding:8px 16px;
    border-radius:999px;
    font-size:.88rem;
    font-weight:700;
}

.title{
    font-size:1.85rem;
    font-weight:900;
    letter-spacing:-1px;
    margin-top:18px;
    color:#0f172a;
}

.subtitle{
    color:#64748b;
    margin-top:10px;
    line-height:1.7;
    font-size:.97rem;
}

.loan-btn{
    width:100%;
    border:none;
    border-radius:24px;
    padding:20px;
    margin-top:16px;
    background:white;
    display:flex;
    align-items:center;
    gap:16px;
    text-align:left;
    cursor:pointer;
    box-shadow:0 10px 28px rgba(15,23,42,.06);
    transition:.25s;
    position:relative;
    overflow:hidden;
}

.loan-btn:hover{
    transform:translateY(-4px);
    box-shadow:0 18px 36px rgba(37,99,235,.15);
}

.loan-btn::after{
    content:'→';
    position:absolute;
    right:22px;
    font-size:1.35rem;
    color:#94a3b8;
}

.icon-wrap{
    width:56px;
    height:56px;
    border-radius:20px;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:1.6rem;
    flex-shrink:0;
}

.icon1{background:#eff6ff;}
.icon2{background:#fff7ed;}

.loan-title{
    font-size:1.08rem;
    font-weight:800;
    color:#111827;
}

.loan-desc{
    font-size:.9rem;
    color:#64748b;
    margin-top:4px;
}

.notice{
    margin-top:24px;
    background:#f8fafc;
    border:1px dashed #cbd5e1;
    border-radius:18px;
    padding:14px;
    color:#475569;
    font-size:.88rem;
    line-height:1.6;
}

.footer{
    text-align:center;
    color:#94a3b8;
    font-size:.8rem;
    margin-top:22px;
}

@keyframes fadeUp{
    from{
        opacity:0;
        transform:translateY(20px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}
</style>
</head>

<body>

<div class="main-card">

    <div class="text-center">
        <span class="logo-badge">
            아주대의료원신협
        </span>

        <div class="title">
            온라인 비대면 대출 신청
        </div>

        <div class="subtitle">
            <b>시범운영중입니다.</b><br>
            신청하실 대출종류를 선택해주세요.<br>
            신협 모바일 대출 신청페이지로 이동합니다.
        </div>
    </div>

    <!-- 보통대출 -->
    <button class="loan-btn"
        onclick="goLoan('https://m.cu.co.kr/otu/zB3OcD0C')">
        <div class="icon-wrap icon1">💳</div>
        <div>
            <div class="loan-title">보통대출</div>
            <div class="loan-desc">
                만기일시 신용대출 신청
            </div>
        </div>
    </button>

    <!-- 자립대월 -->
    <button class="loan-btn"
        onclick="goLoan('https://m.cu.co.kr/otu/c54WcD0C')">
        <div class="icon-wrap icon2">📘</div>
        <div>
            <div class="loan-title">마이너스통장(대월)</div>
            <div class="loan-desc">
                마이너스통장 방식 대출 신청
            </div>
        </div>
    </button>

    <div class="notice">
        ※ 선택 후 신협 모바일 대출 신청 화면으로 이동합니다.<br>
        ※ 본인인증 및 신청 절차는 이동한 페이지에서 진행됩니다.
    </div>

    <div class="footer">
        Copyright © 아주대의료원신협
    </div>

</div>

<script>
function goLoan(url){

    const ok = confirm(
        "직장정보 조회시 [아주대의료원사업자번호 (124-82-06965)]를 직접 입력하여 진행바랍니다."
    );

    if(ok){
        window.location.href = url;
    }
}
</script>

</body>
</html>
