<script>
  document.addEventListener('DOMContentLoaded', function() {
    const calendarBody = document.getElementById('calendar-body');
    const monthYear = document.getElementById('month-year');
    const prevMonth = document.getElementById('prev-month');
    const nextMonth = document.getElementById('next-month');

    let currentMonth = new Date().getMonth();
    let currentYear = new Date().getFullYear();

    const months = [
        'January', 'February', 'March', 'April', 'May', 'June(6월)',
        'July(7월)', 'August(8월)', 'Sep(9월)', 'Oct(10월)', 'Nov(11월)', 'Dec(12월)'
    ];

    function renderCalendar(month, year) {
        calendarBody.innerHTML = '';
        const firstDay = new Date(year, month, 1).getDay();
        const daysInMonth = new Date(year, month + 1, 0).getDate();

        for (let i = 0; i < firstDay; i++) {
            const emptyCell = document.createElement('div');
            emptyCell.classList.add('day');
            calendarBody.appendChild(emptyCell);
        }

        for (let day = 1; day <= daysInMonth; day++) {
            const dayCell = document.createElement('div');
            dayCell.classList.add('day');
            dayCell.textContent = day;
            calendarBody.appendChild(dayCell);
        }

        monthYear.textContent = `${months[month]} ${year}`;
    }

    prevMonth.addEventListener('click', () => {
        currentMonth--;
        if (currentMonth < 0) {
            currentMonth = 11;
            currentYear--;
        }
        renderCalendar(currentMonth, currentYear);
    });

    nextMonth.addEventListener('click', () => {
        currentMonth++;
        if (currentMonth > 11) {
            currentMonth = 0;
            currentYear++;
        }
        renderCalendar(currentMonth, currentYear);
    });

    renderCalendar(currentMonth, currentYear);
}); 


  function showImg() {
    document.getElementById('calendar-container').style.display = 'block';
    document.getElementById('hideCalendar').style.display = 'block';
    document.getElementById('showCalendar').style.display = 'none';
  }
  function imgClose() {
    document.getElementById('calendar-container').style.display = 'none';
    document.getElementById('showCalendar').style.display = 'block';
    document.getElementById('hideCalendar').style.display = 'none';
  }
</script>
